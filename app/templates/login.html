<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%2308746d%27/%3E%3Cpath d=%27M16 8v16M8 16h16%27 stroke=%27white%27 stroke-width=%273%27/%3E%3C/svg%3E">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Doctor Login | HealthGuard IoT</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
</head>
<body class="login-page">
    <main class="login-card">
        <div class="brand-mark" aria-hidden="true">+</div>
        <h1>HealthGuard IoT</h1>
        <p class="subtitle">Doctor Monitoring Portal</p>
        <p class="intro">Sign in to access the patient monitoring dashboard.</p>
        {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
        <form method="post" action="/login">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="username" required>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="submit">Login</button>
        </form>
        <p class="footnote">Academic demonstration · Doctor access</p>
    </main>
</body>
</html>
