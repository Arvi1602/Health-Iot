[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@1.1.2
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@3.11.0

; Compile-only placeholders. Never upload this environment for a physical demo.
[env:compile_check]
extends = env:esp32dev
build_flags = -DHEALTHGUARD_COMPILE_CHECK -DHEALTHGUARD_STAGE=3
